<!-- 2. CARD COMPONENT, BUTTONS, & BOOTSTRAP ALERT -->
<div class="container my-5">
    <div class="row">
        <div class="col-md-8 mx-auto">
            
            <div id="alertInfo" class="alert alert-success fade show d-none" role="alert">
                <strong>Sukses!</strong> Makasih udah nekan tombol biru
            </div>

            <div class="card shadow">
                <div class="card-header bg-warning fw-bold">Info Praktikum</div>
                <div class="card-body">
                    <h5 class="card-title">Materi Hari Ini: Bootstrap 5</h5>
                    <p class="card-text">Belajar membuat tata letak web responsif dengan cepat menggunakan komponen bawaan Bootstrap.</p>
                    
                    <!-- Tombol Pemicu Alert -->
                    <button class="btn btn-primary" onclick="tampilkanAlert()">Pelajari Lebih Lanjut</button>
                    <button class="btn btn-outline-secondary" onclick="sembunyikanAlert()">Sembunyikan Alert</button>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function tampilkanAlert() {
        const alertBox = document.getElementById("alertInfo");
        alertBox.classList.remove("d-none");
    }

    function sembunyikanAlert() {
        const alertBox = document.getElementById("alertInfo");
        alertBox.classList.add("d-none");
    }
</script>
